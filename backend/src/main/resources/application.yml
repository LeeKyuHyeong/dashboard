server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/dashboard
    username: root
    password: placeholder
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  sql:
    init:
      # never: 운영 DB는 이미 초기화됨. always 였을 때 기동마다 seed 가 재실행돼
      # 운영 중 DELETE 한 행(kh-shop)이 부활하는 사고 발생 (2026-07-23).
      # 운영 데이터의 주인은 DB — seed 는 최초 구축 시 수동 실행으로 전환.
      mode: never
      platform: mariadb

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      platform: h2

---

monitoring:
  services:
    - name: ITSM
      projectSlug: itsm
      healthUrl: ""
      containerName: itsm-api
    # quiz 는 nginx 공개 도메인으로 체크 — 앱 포트가 127.0.0.1 바인딩이라
    # host.docker.internal(호스트 게이트웨이)로는 못 붙음 (2026-06-06)
    # TODO: 홈페이지 전체 GET 이라 응답이 큼 — quiz 에 경량 헬스 엔드포인트 생기면 교체
    - name: Song Quiz
      projectSlug: song-quiz
      healthUrl: https://game.kyuhyeong.com/
      containerName: quiz-app
    # kh-shop 자리에 Account 투입 (2026-07-23 shop 서비스 종료).
    # shop 의 공개 도메인 10초 폴링이 홈페이지 HTML 을 매번 통째로 받아
    # 47일간 24.4GB 아웃바운드를 만든 원인이었음 — 간격도 10→60s 로 완화.
    - name: Account
      projectSlug: account
      healthUrl: ""
      containerName: account-api
  checkIntervalSeconds: 60
