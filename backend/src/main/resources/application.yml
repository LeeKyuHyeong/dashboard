server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/dashboard
    username: root
    password: placeholder
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  sql:
    init:
      mode: always
      platform: mariadb

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      platform: h2

---

monitoring:
  services:
    - name: ITSM
      projectSlug: itsm
      healthUrl: http://itsm-api:8080/actuator/health
      containerName: itsm-api
    # quiz/shop 은 nginx 공개 도메인으로 체크 — 앱 포트가 127.0.0.1 바인딩이면
    # host.docker.internal(호스트 게이트웨이)로는 못 붙음 (shop 이 그 케이스, 2026-06-06)
    - name: Song Quiz
      projectSlug: song-quiz
      healthUrl: https://game.kyuhyeong.com/
      containerName: quiz-app
    - name: KH Shop
      projectSlug: kh-shop
      healthUrl: https://shop.kyuhyeong.com/
      containerName: shop-app
  checkIntervalSeconds: 10
